<style>
  /* estilos del visor 3D (#escena3d) - enlazar en el <head> de la pagina:
   <link rel="stylesheet" href="../style/escena3d.css" />  (guardalo en style/escena3d.css) */
#escena3d { position: relative; width: 100%; height: 100vh; min-height: 420px; overflow: hidden;
  background: #0b0f1a; color: #eef2fb; border-radius: inherit; font-family: inherit; }
#escena3d:fullscreen { height: 100vh; width: 100vw; border-radius: 0; }
#escena3d canvas.escena-canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block;
  touch-action: pan-y; outline: none; }
#escena3d.activo canvas.escena-canvas { touch-action: none; cursor: grab; }
#escena3d.activo canvas.escena-canvas:active { cursor: grabbing; }
#escena3d .esc-load { position: absolute; inset: 0; z-index: 5; display: flex; flex-direction: column; align-items: center;
  justify-content: center; gap: 12px; background: #0b0f1a; font-size: 13px; letter-spacing: .08em; transition: opacity .7s; }
#escena3d.cargado .esc-load { opacity: 0; pointer-events: none; }
#escena3d .esc-bar { width: min(260px, 60%); height: 3px; background: #1c2438; border-radius: 2px; overflow: hidden; }
#escena3d .esc-bar i { display: block; height: 100%; width: 0; background: #7f98ff; transition: width .2s; }
#escena3d .esc-btn { position: absolute; z-index: 4; border: 0; cursor: pointer; color: #fff; font: inherit; font-size: 13px;
  background: rgba(11, 15, 26, .55); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); border-radius: 999px; }
#escena3d .esc-enter { left: 50%; bottom: 22px; transform: translateX(-50%); padding: 12px 26px; letter-spacing: .08em;
  border: 1px solid rgba(255, 255, 255, .35); }
#escena3d.activo .esc-enter { display: none; }
#escena3d .esc-top { position: absolute; z-index: 4; top: 14px; right: 14px; display: flex; gap: 8px; }
#escena3d .esc-top .esc-btn { position: static; width: 40px; height: 40px; padding: 0; font-size: 18px; display: grid; place-items: center; }
#escena3d .esc-exit { display: none !important; }
#escena3d.activo .esc-exit { display: grid !important; }
#escena3d .esc-panel { position: absolute; z-index: 4; top: 62px; right: 14px; width: min(270px, 78%); max-height: calc(100% - 80px);
  overflow: auto; padding: 12px 14px 14px; border-radius: 14px; background: rgba(11, 15, 26, .78); backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px); font-size: 12px; display: none; }
#escena3d .esc-panel.open { display: block; }
#escena3d .esc-title { margin: 0 0 4px; font-size: 11px; letter-spacing: .14em; text-transform: uppercase; opacity: .7; }
#escena3d .esc-panel label { display: flex; justify-content: space-between; align-items: center; margin: 9px 0 2px; opacity: .92; }
#escena3d .esc-panel label.esc-check { justify-content: flex-start; gap: 8px; }
#escena3d .esc-panel input[type=range] { width: 100%; accent-color: #7f98ff; }
#escena3d .esc-panel button { margin-top: 12px; width: 100%; padding: 8px; border: 1px solid rgba(255, 255, 255, .3); border-radius: 8px;
  background: transparent; color: #fff; font: inherit; cursor: pointer; }
#escena3d .esc-hint { position: absolute; z-index: 3; left: 50%; bottom: 16px; transform: translateX(-50%); padding: 8px 14px;
  border-radius: 999px; background: rgba(11, 15, 26, .55); backdrop-filter: blur(6px); font-size: 12px; text-align: center;
  max-width: 90%; opacity: 0; transition: opacity .6s; pointer-events: none; }
#escena3d.activo .esc-hint { opacity: .9; }
#escena3d.pc .h-touch, #escena3d.touch .h-pc { display: none; }
#escena3d .esc-joy { position: absolute; z-index: 3; width: 120px; height: 120px; margin: -60px 0 0 -60px; border-radius: 50%;
  display: none; border: 2px solid rgba(255, 255, 255, .25); background: rgba(255, 255, 255, .06); pointer-events: none; }
#escena3d .esc-joy i { position: absolute; left: 50%; top: 50%; width: 44px; height: 44px; margin: -22px 0 0 -22px; border-radius: 50%;
  background: rgba(255, 255, 255, .35); }
</style>

              </label>

                <span class="lang-radio"></span>

            </div>

          </div>

      </div>
    </div>

    <div class="cont_imagen_proyecto">
      <!-- data-lenis-prevent: evita que el scroll suave del sitio capture la rueda dentro de la escena -->
      <div id="escena3d" data-lenis-prevent="">
        <div class="esc-load" id="esc-load">
          <span data-i18n="ui-loading">Loading scene…</span>
          <div class="esc-bar"><i></i></div>
        </div>

        <button id="esc-enter" class="esc-btn esc-enter cursor-scale" type="button">
          <span data-i18n="ui-enter">Explore</span>
        </button>

        <div class="esc-top">
          <button id="esc-gear" class="esc-btn cursor-scale" type="button" title="Lights" aria-label="Lights">☀</button>
          <button id="esc-fs" class="esc-btn cursor-scale" type="button" title="Fullscreen"
            aria-label="Fullscreen">⛶</button>
          <button id="esc-exit" class="esc-btn esc-exit cursor-scale" type="button" title="Exit"
            aria-label="Exit">✕</button>
        </div>

        <div id="esc-panel" class="esc-panel">
          <p class="esc-title" data-i18n="ui-panel-title">Light controls</p>
          <label><span data-i18n="ui-sun-az">Light angle</span> <b id="esc-vaz"></b></label>
          <input id="esc-az" type="range" min="0" max="360" step="1" value="20">
          <label><span data-i18n="ui-sun-el">Light height</span> <b id="esc-vel"></b></label>
          <input id="esc-el" type="range" min="35" max="90" step="1" value="68">
          <label><span data-i18n="ui-rays">Light rays</span> <b id="esc-vry"></b></label>
          <input id="esc-ry" type="range" min="0" max="2" step="0.05" value="1">
          <label class="esc-check"><input id="esc-auto" type="checkbox"><span data-i18n="ui-auto">Animate
              sun</span></label>
          <label class="esc-check"><input id="esc-refl" type="checkbox" checked=""><span data-i18n="ui-refl">Floor
              reflection</span></label>
          <label><span data-i18n="ui-rs">Reflection strength</span> <b id="esc-vrs"></b></label>
          <input id="esc-rs" type="range" min="0" max="1" step="0.05" value="0.6">
          <label><span data-i18n="ui-exp">Exposure</span> <b id="esc-vexp"></b></label>
          <input id="esc-exp" type="range" min="0.4" max="2.2" step="0.05" value="1">
          <label><span data-i18n="ui-res">Resolution</span> <b id="esc-vq"></b></label>
          <input id="esc-q" type="range" min="0.6" max="2" step="0.05" value="1">
          <label><span data-i18n="ui-paint">Painting style</span> <b id="esc-vpaint"></b></label>
          <input id="esc-paint" type="range" min="0" max="1" step="0.05" value="0.55">
          <button id="esc-reset" type="button" data-i18n="ui-reset">Reset</button>
        </div>

        <p id="esc-hint" class="esc-hint">

            exit</span>
          <span class="h-touch" data-i18n="ui-hint-touch">Drag on the left to walk · drag anywhere else to look</span>
        </p>
        <div id="esc-joy" class="esc-joy"><i></i></div>
